[package]
name = "syncopate"
version = "0.0.2"
edition = "2024"
authors = ["Zibi Braniecki <zibi@braniecki.net>"]
license = "MIT OR Apache-2.0"
description = "A hierarchical, power-aware task scheduler for Rust applications requiring precise timing control"
repository = "https://github.com/zbraniecki/syncopate"
categories = ["asynchronous", "concurrency", "algorithms"]

[features]
default = ["serde"]
serde = ["dep:serde_crate", "dep:serde_json"]

[dependencies]
thiserror = "2"
serde_crate = { package = "serde", version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
divan = "0.1"
jiff = "0.2"
serde_json = "1"

# [[bench]]
# name = "tick_overhead"
# harness = false

# [[bench]]
# name = "scheduling_analysis"
# harness = false
