[package]
name = "syncopate-benchmark"
version = "0.1.0"
edition = "2024"
authors = ["Zibi Braniecki <zibi@braniecki.net>"]
license = "MIT OR Apache-2.0"
description = "Cross-platform timer benchmark comparing native timers to syncopate"

[dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
statrs = "0.16"
syncopate = { path = "../syncopate" }
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch = "0.2"
libc = "0.2"
mach2 = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["time", "event"] }

[[bin]]
name = "syncopate-benchmark"
path = "src/main.rs"
